<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — LifeDrop</title>
  <script>try{if(localStorage.getItem('lifedrop_dark')==='true'){document.documentElement.style.background='#0A0A0C';}}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body>
  <div id="toast-container"></div>
  <div class="auth-page">
    <!-- NAVBAR -->
    <div class="auth-navbar">
      <a href="index.html" class="navbar-brand">
        <div class="logo-icon"><svg width="22" height="22" viewBox="0 0 100 100" fill="var(--red)"><path d="M50 8 C50 8 18 32 18 56 C18 74 32 88 50 88 C68 88 82 74 82 56 C82 32 50 8 50 8Z"/></svg></div>
        Life<span class="drop">Drop</span>
      </a>
      <button class="icon-btn dark-toggle" id="darkModeToggle" title="Toggle dark mode"></button>
    </div>

    <!-- BODY -->
    <div class="auth-body">
      <div class="auth-card">
        <div class="auth-logo-center">
          <div style="background:var(--red-muted);border:1px solid var(--red-border);padding:16px;border-radius:16px;display:flex;align-items:center;justify-content:center;">
            <svg width="32" height="32" viewBox="0 0 100 100" fill="var(--red)"><path d="M50 8 C50 8 18 32 18 56 C18 74 32 88 50 88 C68 88 82 74 82 56 C82 32 50 8 50 8Z"/></svg>
          </div>
        </div>
        <h1 class="auth-heading">Welcome Back</h1>
        <p class="auth-sub">Your contribution saves lives. Access your portal.</p>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="Email Address" autocomplete="email" required/>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password" class="form-input" placeholder="Password" autocomplete="current-password" required style="padding-right:42px;"/>
              <button type="button" class="toggle-password" onclick="togglePassword()" title="Show/hide password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="remember-row">
              <input type="checkbox" id="rememberMe"/>
              Remember me
            </label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-bottom:8px;">Sign In</button>
        </form>

        <div class="divider">OR CONTINUE WITH</div>

        <button class="btn-google" onclick="showToast('Info','Google sign-in is coming soon','info')">
          <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2a9.7 9.7 0 00-.16-1.74H9v3.3h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.54z" fill="#4285F4"/><path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26a5.4 5.4 0 01-8.07-2.85H.96v2.34A9 9 0 009 18z" fill="#34A853"/><path d="M3.97 10.71A5.41 5.41 0 013.97 7.3V4.96H.96a9 9 0 000 8.09l3.01-2.34z" fill="#FBBC05"/><path d="M9 3.58c1.32 0 2.51.45 3.44 1.34l2.58-2.58A9 9 0 00.96 4.96L3.97 7.3A5.41 5.41 0 019 3.58z" fill="#EA4335"/></svg>
          Continue with Google
        </button>

        <div class="auth-switch">
          New to LifeDrop? <a href="register.html">Join LifeDrop →</a>
        </div>
      </div>
    </div>

    <div class="auth-footer">
      © 2025 LifeDrop · <a href="about.html" style="color:var(--red);">About</a> · <a href="contact.html" style="color:var(--red);">Contact</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
