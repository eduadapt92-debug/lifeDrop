services:
  - type: web
    name: lifedrop-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLIENT_URL
        value: https://lifedrop-frontend.onrender.com
      - key: NODE_ENV
        value: production

  - type: web
    name: lifedrop-frontend
    env: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
